name: Check Coach Loop changes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - name: Save QC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coach-loop-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-checks/
          include-hidden-files: true
          retention-days: 14
